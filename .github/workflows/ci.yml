name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out ./...
      - run: go tool cover -func=coverage.out | tail -1

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.6.1

  smoke:
    # Runs the built binary on the intentionally vulnerable fixtures and checks
    # the exit code and that the SARIF output is valid JSON with results.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: make build
      - name: Vulnerable fixtures must fail
        run: |
          set +e
          ./bin/oidc-trust-audit --output markdown internal/awsiam/testdata/*.json internal/gcpwif/testdata/*.json | tee -a "$GITHUB_STEP_SUMMARY"
          code=${PIPESTATUS[0]}
          set -e
          test "$code" -eq 1
      - name: SARIF output is valid
        run: |
          ./bin/oidc-trust-audit --output sarif internal/awsiam/testdata/*.json > results.sarif || true
          jq -e '.version == "2.1.0" and (.runs[0].results | length) > 0' results.sarif
