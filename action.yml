name: oidc-trust-audit
description: Audit AWS IAM and Google Cloud Workload Identity trust for over-permissive OIDC federation (GitHub Actions, EKS IRSA)
branding:
  icon: shield
  color: red

inputs:
  files:
    description: Space separated JSON files produced by the AWS CLI or gcloud
    required: true
  fail-on:
    description: Fail the step on findings at least this severe (high, medium, low)
    default: high
  upload-sarif:
    description: Upload results to GitHub code scanning (needs security-events write)
    default: "true"

runs:
  using: composite
  steps:
    - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
      with:
        go-version: stable
        cache: false
    - name: Install oidc-trust-audit
      shell: bash
      env:
        REF: ${{ github.action_ref }}
      run: go install "github.com/OTA-EITA/oidc-trust-audit/cmd/oidc-trust-audit@${REF:-latest}"
    - name: Audit
      id: audit
      shell: bash
      env:
        FILES: ${{ inputs.files }}
        FAIL_ON: ${{ inputs.fail-on }}
      run: |
        # shellcheck disable=SC2086
        "$(go env GOPATH)/bin/oidc-trust-audit" --output sarif --fail-on "$FAIL_ON" $FILES > oidc-trust-audit.sarif && echo "code=0" >> "$GITHUB_OUTPUT" || echo "code=$?" >> "$GITHUB_OUTPUT"
        # shellcheck disable=SC2086
        "$(go env GOPATH)/bin/oidc-trust-audit" --output markdown --quiet $FILES >> "$GITHUB_STEP_SUMMARY" || true
    - if: inputs.upload-sarif == 'true'
      uses: github/codeql-action/upload-sarif@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3
      with:
        sarif_file: oidc-trust-audit.sarif
        category: oidc-trust-audit
    - name: Enforce threshold
      shell: bash
      env:
        CODE: ${{ steps.audit.outputs.code }}
      run: exit "$CODE"
